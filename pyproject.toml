[project]
name = "agentic-vs-basic-rag"
version = "0.1.0"
description = "Terminal demo comparing Basic RAG vs Agentic RAG on banking compliance data"
requires-python = ">=3.12,<3.14"
dependencies = [
    # LangChain / LangGraph
    "langchain==1.3.2",
    "langchain-core==1.4.0",
    "langchain-community==0.4.2",
    "langchain-anthropic==1.4.3",
    "langchain-voyageai==0.3.3",
    "langchain-chroma==1.1.0",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.2",
    # Vector store + embeddings
    "chromadb==1.5.9",
    # LLM client
    "anthropic==0.104.1",
    # Demo UI
    "streamlit==1.57.0",
    # PDF / text processing
    "pypdf==6.12.2",
    "tiktoken==0.13.0",
    # Utilities
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    # Web / scraping tools
    "apify-client==3.0.2",
    "tavily-python==0.7.24",
    "firecrawl-py==4.28.0",
    # Backend API
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "sse-starlette==3.4.4",
    "slowapi==0.1.9",
    "reportlab>=4.5.1",
    "pymupdf>=1.27.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests calling real external APIs — deselect with '-m not e2e'",
    "integration: tests using real ChromaDB with mocked LLM",
]

[tool.uv]
# onnxruntime >= 1.24 dropped macOS Intel (x86_64) wheels; pin to last supported version
override-dependencies = ["onnxruntime==1.23.2"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "git-filter-repo==2.47.0",
]
